<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Firmador Pro</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>

<style>
body { font-family: Arial; }
#pdfContainer canvas { border:1px solid #ccc; margin-bottom:15px; cursor: crosshair; }

#firmaModal {
  display:none;
  position:fixed;
  top:50%; left:50%;
  transform:translate(-50%, -50%);
  background:white;
  padding:20px;
  border:1px solid #333;
  z-index:1000;
}

#firmaCanvas {
  border:2px dashed black;
  touch-action:none;
}

#overlay {
  position:absolute;
  border:2px dashed red;
  resize:both;
  overflow:hidden;
  cursor:move;
}

</style>
</head>
<body>

<h2>Subir PDF</h2>
<input type="file" id="pdfUpload" accept="application/pdf">

<h3>Documento</h3>
<div id="pdfContainer"></div>

<br>
<button onclick="descargarFirmado()" id="downloadBtn" style="display:none;">
Descargar PDF firmado
</button>

<!-- Modal Firma -->
<div id="firmaModal">
  <h3>Firma aquí</h3>
  <canvas id="firmaCanvas" width="300" height="150"></canvas>
  <br><br>
  <label><input type="checkbox" id="addDate"> Agregar fecha automática</label>
  <br><br>
  <button onclick="limpiarFirma()">Limpiar</button>
  <button onclick="guardarFirma()">Insertar</button>
</div>

<script>

let originalPdfBytes;
let pdfActualBytes;
let firmas = [];
let paginaSeleccionada = 0;
let posX = 0;
let posY = 0;

const container = document.getElementById("pdfContainer");

/* ===================== */
/*      CARGAR PDF       */
/* ===================== */

document.getElementById("pdfUpload").addEventListener("change", async function(e){
  const file = e.target.files[0];
  originalPdfBytes = await file.arrayBuffer();
  pdfActualBytes = originalPdfBytes.slice(0);
  renderPDF(pdfActualBytes);
});

/* ===================== */
/*   RENDER MULTIPAGINA  */
/* ===================== */

async function renderPDF(bytes){
  container.innerHTML = "";
  const loadingTask = pdfjsLib.getDocument({ data: bytes.slice(0) });
  const pdf = await loadingTask.promise;

  for(let i=1; i<=pdf.numPages; i++){
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale:1.3 });

    const canvas = document.createElement("canvas");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    container.appendChild(canvas);

    await page.render({
      canvasContext: canvas.getContext("2d"),
      viewport: viewport
    }).promise;

    canvas.addEventListener("click", (e)=>{
      const rect = canvas.getBoundingClientRect();
      posX = e.clientX - rect.left;
      posY = canvas.height - (e.clientY - rect.top);
      paginaSeleccionada = i-1;
      abrirModal();
    });
  }
}

/* ===================== */
/*       FIRMA           */
/* ===================== */

const firmaCanvas = document.getElementById("firmaCanvas");
const ctx = firmaCanvas.getContext("2d");
let dibujando = false;

firmaCanvas.addEventListener("mousedown", e=>{
  dibujando = true;
  ctx.beginPath();
  ctx.moveTo(e.offsetX, e.offsetY);
});

firmaCanvas.addEventListener("mousemove", e=>{
  if(!dibujando) return;
  ctx.lineTo(e.offsetX, e.offsetY);
  ctx.stroke();
});

firmaCanvas.addEventListener("mouseup", ()=>dibujando=false);

function limpiarFirma(){
  ctx.clearRect(0,0,firmaCanvas.width,firmaCanvas.height);
}

function abrirModal(){
  document.getElementById("firmaModal").style.display="block";
}

/* ===================== */
/*     INSERTAR FIRMA    */
/* ===================== */

async function guardarFirma(){
  const { PDFDocument, rgb, StandardFonts } = PDFLib;

  const pdfDoc = await PDFDocument.load(pdfActualBytes.slice(0));
  const pages = pdfDoc.getPages();
  const page = pages[paginaSeleccionada];

  const firmaImg = firmaCanvas.toDataURL("image/png");
  const pngImage = await pdfDoc.embedPng(firmaImg);

  page.drawImage(pngImage,{
    x: posX,
    y: posY,
    width:150,
    height:70
  });

  if(document.getElementById("addDate").checked){
    const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
    const fecha = new Date().toLocaleString();

    page.drawText(fecha,{
      x: posX,
      y: posY - 15,
      size:10,
      font:font,
      color: rgb(0,0,0)
    });
  }

  pdfActualBytes = await pdfDoc.save();
  await renderPDF(pdfActualBytes);

  document.getElementById("firmaModal").style.display="none";
  document.getElementById("downloadBtn").style.display="inline";

  limpiarFirma();
}

/* ===================== */
/*     DESCARGAR         */
/* ===================== */

function descargarFirmado(){
  const blob = new Blob([pdfActualBytes], { type:"application/pdf" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "pdf_firmado.pdf";
  link.click();
}

</script>
</body>
</html>
